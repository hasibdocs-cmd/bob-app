services:
  db:
    image: postgres:16-alpine
    container_name: nagaraai_db
    environment:
      POSTGRES_USER: nagaraai
      POSTGRES_PASSWORD: nagaraai123
      POSTGRES_DB: nagaraai_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nagaraai -d nagaraai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagaraai_backend
    environment:
      DATABASE_URL: postgresql://nagaraai:nagaraai123@db:5432/nagaraai_db
      SECRET_KEY: change-me-in-production
      WATSONX_API_KEY: ${WATSONX_API_KEY:-}
      WATSONX_PROJECT_ID: ${WATSONX_PROJECT_ID:-}
      APP_BASE_URL: ${APP_BASE_URL:-https://nagaraai.example.com}
      # ── Twilio (WhatsApp / SMS / Voice) ──────────────────────────────────────
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
      TWILIO_VERIFY_SIGNATURE: ${TWILIO_VERIFY_SIGNATURE:-false}
      # ── Telegram Bot ─────────────────────────────────────────────────────────
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # ── SMTP Email ───────────────────────────────────────────────────────────
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-nagaraai@example.com}
      # ── Meta (Facebook / Instagram) ──────────────────────────────────────────
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-nagaraai-verify}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_IG_ACCESS_TOKEN: ${META_IG_ACCESS_TOKEN:-}
      # ── Twitter/X ────────────────────────────────────────────────────────────
      TWITTER_API_KEY: ${TWITTER_API_KEY:-}
      TWITTER_API_SECRET: ${TWITTER_API_SECRET:-}
      TWITTER_ACCESS_TOKEN: ${TWITTER_ACCESS_TOKEN:-}
      TWITTER_ACCESS_SECRET: ${TWITTER_ACCESS_SECRET:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nagaraai_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      # Tells setupProxy.js to forward /api/* to the backend container name, not localhost
      REACT_APP_PROXY_TARGET: http://backend:8000

  test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: nagaraai_test
    environment:
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: test-secret-key
      WATSONX_API_KEY: ""
      WATSONX_PROJECT_ID: ""
    profiles:
      - test

volumes:
  pgdata:
