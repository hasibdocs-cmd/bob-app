version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: nagaraai_db
    environment:
      POSTGRES_USER: nagaraai
      POSTGRES_PASSWORD: nagaraai123
      POSTGRES_DB: nagaraai_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nagaraai -d nagaraai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagaraai_backend
    environment:
      DATABASE_URL: postgresql://nagaraai:nagaraai123@db:5432/nagaraai_db
      SECRET_KEY: change-me-in-production
      WATSONX_API_KEY: ${WATSONX_API_KEY:-}
      WATSONX_PROJECT_ID: ${WATSONX_PROJECT_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nagaraai_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8000

volumes:
  pgdata:
