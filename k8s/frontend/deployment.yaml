apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  namespace: nagaraai
data:
  default.conf: |
    server {
        listen 3000;
        server_name _;

        # Serve the React static build
        root /usr/share/nginx/html;
        index index.html;

        # Proxy /api/* → backend service (keeps relative URLs working)
        location /api/ {
            proxy_pass         http://backend-svc:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Everything else → React (client-side routing)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: nagaraai
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # minikube:  eval $(minikube docker-env) && docker build -t nagaraai-frontend:latest ./frontend
          # kind:       kind load docker-image nagaraai-frontend:latest
          image: nagaraai-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx-conf
